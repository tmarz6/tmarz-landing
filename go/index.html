<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#04060E;
  font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100%;
  padding:16px;
  position:relative;
}

/* Background */
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 100% 80% at 50% 50%,rgba(26,92,255,0.2) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(26,92,255,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,92,255,0.07) 1px,transparent 1px);
  background-size:44px 44px;
  pointer-events:none;z-index:0;
}

.card{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  background:rgba(8,11,26,0.9);
  border:1px solid rgba(26,92,255,0.4);
  border-radius:18px;
  padding:40px 28px 32px;
  text-align:center;
  box-shadow:0 0 80px rgba(26,92,255,0.1),0 24px 60px rgba(0,0,0,0.5);
}

.logo{
  font-size:.8rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:#4D85FF;margin-bottom:22px;
}

h1{
  font-size:clamp(2rem,8vw,2.6rem);
  font-weight:800;line-height:1.05;
  text-transform:uppercase;
  color:#fff;margin-bottom:30px;
  letter-spacing:-.01em;
}
h1 .accent{color:#4D85FF}

.btn{
  display:block;width:100%;
  padding:18px 24px;
  background:#1A5CFF;color:#fff;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;font-size:.95rem;
  letter-spacing:.06em;text-transform:uppercase;
  border:none;border-radius:10px;cursor:pointer;
  box-shadow:0 0 28px rgba(26,92,255,0.45),0 4px 16px rgba(0,0,0,.4);
  transition:background .2s,transform .15s;
  text-decoration:none;
}
.btn:hover{background:#2a6bff}
.btn:active{transform:scale(.98)}

.cd-row{
  display:flex;align-items:center;
  justify-content:center;gap:8px;
  margin-top:18px;
}
.cd-label{font-size:.72rem;color:rgba(255,255,255,0.3);letter-spacing:.03em}
.ring-wrap{position:relative;width:26px;height:26px;flex-shrink:0}
.ring-svg{width:26px;height:26px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:3}
.ring-fill{fill:none;stroke:#4D85FF;stroke-width:3;stroke-linecap:round;stroke-dasharray:65.97;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.ring-num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:.68rem;font-weight:700;color:#4D85FF;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">T Marz</div>
  <h1>Get Your<br><span class="accent">Free Training</span><br>Now</h1>
  <a href="https://t-marz.com/" class="btn" id="yesBtn">Yes, I Want In &rarr;</a>
  <div class="cd-row">
    <span class="cd-label">Redirecting in</span>
    <div class="ring-wrap">
      <svg viewBox="0 0 26 26" class="ring-svg">
        <circle cx="13" cy="13" r="10.5" class="ring-bg"/>
        <circle cx="13" cy="13" r="10.5" class="ring-fill" id="ringFill"/>
      </svg>
      <span class="ring-num" id="ringNum">5</span>
    </div>
    <span class="cd-label">seconds</span>
  </div>
</div>
<script>
const DEST='https://t-marz.com/';
const circ=2*Math.PI*10.5;
const ring=document.getElementById('ringFill');
const num=document.getElementById('ringNum');
ring.style.strokeDasharray=circ;
ring.style.strokeDashoffset=0;
let s=5,timer;
function tick(){
  num.textContent=s;
  ring.style.strokeDashoffset=circ*(1-s/5);
  if(s<=0){window.location.href=DEST;return;}
  s--;timer=setTimeout(tick,1000);
}
tick();
document.getElementById('yesBtn').addEventListener('click',function(e){
  e.preventDefault();clearTimeout(timer);window.location.href=DEST;
});
</script>
</body>
</html>
